server:
  port: 8082   

spring:
  application:
    name: PRODUCTMS

  datasource:
    url: jdbc:mysql://localhost:3306/productdb
    username: root
    password: Soaib@7672
    driver-class-name: com.mysql.cj.jdbc.Driver   # ✅ FIXED (was driverClassName)

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true        # ✅ IMPORTANT
    instance-id: ${spring.application.name}:${random.value}   # ✅ ADDED