server:
  port: 4000

spring:
  application:
    name: EKARTGATEWAY

  main:
    web-application-type: reactive

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # =========================
            # AUTH SERVICE
            # =========================
            - id: auth-service
              uri: lb://AUTHMS
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2

            # =========================
            # API ROUTES
            # =========================

            - id: product-service
              uri: lb://PRODUCTMS
              predicates:
                - Path=/api/products/**
              filters:
                - StripPrefix=1

            - id: customer-service
              uri: lb://CUSTOMERMS
              predicates:
                - Path=/api/customers/**
              filters:
                - StripPrefix=1

            - id: cart-service
              uri: lb://CUSTOMERCARTMS
              predicates:
                - Path=/api/cart/**
              filters:
                - StripPrefix=1

            - id: payment-service
              uri: lb://PAYMENTMS
              predicates:
                - Path=/api/payment/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: lb://ORDERMS
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1


            # =========================
            # ✅ FINAL SWAGGER ROUTES (FIXED)
            # =========================

            - id: auth-docs
              uri: lb://AUTHMS
              predicates:
                - Path=/auth/v3/api-docs, /auth/v3/api-docs/**
              filters:
                - RewritePath=/auth/v3/api-docs(?<segment>/?.*), /v3/api-docs${segment}

            - id: customer-docs
              uri: lb://CUSTOMERMS
              predicates:
                - Path=/customer/v3/api-docs, /customer/v3/api-docs/**
              filters:
                - RewritePath=/customer/v3/api-docs(?<segment>/?.*), /v3/api-docs${segment}

            - id: product-docs
              uri: lb://PRODUCTMS
              predicates:
                - Path=/product/v3/api-docs, /product/v3/api-docs/**
              filters:
                - RewritePath=/product/v3/api-docs(?<segment>/?.*), /v3/api-docs${segment}

            - id: order-docs
              uri: lb://ORDERMS
              predicates:
                - Path=/order/v3/api-docs, /order/v3/api-docs/**
              filters:
                - RewritePath=/order/v3/api-docs(?<segment>/?.*), /v3/api-docs${segment}

            - id: payment-docs
              uri: lb://PAYMENTMS
              predicates:
                - Path=/payment/v3/api-docs, /payment/v3/api-docs/**
              filters:
                - RewritePath=/payment/v3/api-docs(?<segment>/?.*), /v3/api-docs${segment}

            - id: cart-docs
              uri: lb://CUSTOMERCARTMS
              predicates:
                - Path=/cart/v3/api-docs, /cart/v3/api-docs/**
              filters:
                - RewritePath=/cart/v3/api-docs(?<segment>/?.*), /v3/api-docs${segment}


# =========================
# EUREKA CONFIG
# =========================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


# =========================
# SWAGGER UI
# =========================
springdoc:
  swagger-ui:
    urls:
      - name: AUTH SERVICE
        url: /auth/v3/api-docs
      - name: CUSTOMER SERVICE
        url: /customer/v3/api-docs
      - name: PRODUCT SERVICE
        url: /product/v3/api-docs
      - name: ORDER SERVICE
        url: /order/v3/api-docs
      - name: PAYMENT SERVICE
        url: /payment/v3/api-docs
      - name: CART SERVICE
        url: /cart/v3/api-docs